# Single-host demo stack: ethtool_exporter + Prometheus + Grafana.
#
#   cd compose && docker compose up -d --build
#   open http://127.0.0.1:3000  (admin / $GRAFANA_ADMIN_PASSWORD, default "admin")
#
# Linux only. Every service uses the host network namespace so the exporter sees
# the real interfaces, and all listeners stay on 127.0.0.1. Use an SSH tunnel
# (ssh -L 3000:127.0.0.1:3000 host) to reach Grafana from another machine.

name: eth-exporter

services:
  ethtool-exporter:
    build:
      context: ..
      args:
        VERSION: compose
    image: eth-exporter:local
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/eth-exporter/ethtool-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards/eth-exporter:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

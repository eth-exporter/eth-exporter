# Drop-in: disable AF_PACKET neighbor capture and drop CAP_NET_RAW.
# install -d /etc/systemd/system/ethtool_exporter.service.d
# install -m 644 ethtool_exporter-noneighbor.conf /etc/systemd/system/ethtool_exporter.service.d/noneighbor.conf
# systemctl daemon-reload && systemctl restart ethtool_exporter

[Service]
CapabilityBoundingSet=CAP_NET_ADMIN
AmbientCapabilities=CAP_NET_ADMIN
ExecStart=
ExecStart=/usr/local/bin/ethtool_exporter \
  --web.listen-address=127.0.0.1:9417 \
  --collector.neighbor=false \
  --collector.device-exclude=^(lo|docker.*|veth.*|br-.*|virbr.*)$

# Example --web.config.file for TLS and/or basic auth.
# Docs: https://prometheus.io/docs/guides/tls-encryption/
#
# Install as /etc/ethtool_exporter/web-config.yml
#   chown root:ethtool_exporter /etc/ethtool_exporter/web-config.yml
#   chmod 640 /etc/ethtool_exporter/web-config.yml
#
# Generate a bcrypt hash:
#   htpasswd -nBC 10 "" | tr -d ':\n'

tls_server_config:
  cert_file: /etc/ethtool_exporter/tls.crt
  key_file: /etc/ethtool_exporter/tls.key
  # Optional mTLS:
  # client_auth_type: RequireAndVerifyClientCert
  # client_ca_file: /etc/ethtool_exporter/clients-ca.crt

basic_auth_users:
  scrape: $2y$10$exampleReplaceWithRealBcryptHash....................
